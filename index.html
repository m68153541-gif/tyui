<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⭐ Забава Игра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            padding: 20px 12px;
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
        }

        #app {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 48px 48px 32px 32px;
            padding: 24px 20px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 18px;
        }

        /* ===== КАРТОЧКА ===== */
        .user-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 16px 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .user-card .label {
            font-size: 12px;
            color: #888888;
            letter-spacing: 0.3px;
        }
        .user-card .value {
            font-weight: 600;
            text-align: right;
            color: #ffffff;
            font-size: 14px;
            word-break: break-all;
        }
        .user-card .full {
            grid-column: span 2;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        #userUid {
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
        }
        #userUid:hover {
            color: #ffffff;
        }

        /* ===== БАЛАНС ===== */
        .balance-grid {
            display: flex;
            gap: 14px;
            margin: 12px 0 18px;
        }
        .balance-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .balance-item .num {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        .balance-item .num.gold {
            color: #ffd700;
        }
        .balance-item .num.cyan {
            color: #00d4ff;
        }
        .balance-item .lbl {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
        }

        /* ===== ПИТОМЕЦ ===== */
        .pet-status {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* ===== СЕТКА КНОПОК ===== */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px 12px;
            margin-top: 6px;
        }

        /* ===== КНОПКИ (БЕЛЫЕ) ===== */
        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 10px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #000000;
            cursor: pointer;
            transition: all 0.08s ease-out;
            will-change: transform, box-shadow;
            letter-spacing: 0.3px;
            background: #ffffff;
            box-shadow: 0 4px 0 #999999, 0 4px 12px rgba(0, 0, 0, 0.3);
            text-shadow: none;
        }

        /* Анимация падения при нажатии */
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #999999, 0 4px 12px rgba(0, 0, 0, 0.3);
            transition-duration: 0.04s;
        }

        /* Кнопка Поддержка - красная */
        .btn.danger {
            background: #e74c3c;
            color: #ffffff;
            box-shadow: 0 4px 0 #962d22, 0 4px 12px rgba(231, 76, 60, 0.3);
        }
        .btn.danger:active {
            box-shadow: 0 1px 0 #962d22, 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        /* Размеры */
        .btn.full {
            grid-column: span 3;
        }
        .btn.small {
            padding: 12px 10px;
            font-size: 13px;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #999999;
            pointer-events: none;
        }

        /* ===== КОЛЕСО ===== */
        .wheel-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .wheel-overlay.active {
            display: flex;
        }
        .wheel-container {
            background: rgba(20, 20, 20, 0.98);
            border-radius: 48px;
            padding: 28px 24px 32px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            animation: scaleUp 0.25s ease;
        }
        .wheel-container h2 {
            text-align: center;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .wheel-wrapper {
            position: relative;
            margin: 0 auto;
            max-width: 320px;
        }
        #wheelCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }
        .wheel-result {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            padding: 12px 0 6px;
            min-height: 50px;
            color: #ffffff;
        }
        .wheel-actions {
            display: flex;
            gap: 12px;
        }
        .wheel-actions .btn {
            flex: 1;
        }

        /* ===== МОДАЛКА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: rgba(20, 20, 20, 0.98);
            border-radius: 40px;
            padding: 28px 24px 30px;
            max-width: 440px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: scaleUp 0.2s ease;
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 22px;
            color: #ffffff;
        }
        .modal input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }
        .modal input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }
        .modal .btn {
            margin-top: 8px;
        }

        /* ===== ТОСТ ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            padding: 14px 28px;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 500;
            font-size: 15px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 9999;
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
            text-align: center;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== КЛИКЕР ===== */
        .clicker-star {
            font-size: 72px;
            cursor: pointer;
            user-select: none;
            margin: 6px 0;
            transition: 0.1s;
        }
        .clicker-star.pop {
            animation: popStar 0.2s ease;
        }
        @keyframes popStar {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ffd700; }
            100% { transform: scale(1); }
        }
        .clicker-progress {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
        }
        .clicker-progress .fill {
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 20px;
            transition: 0.2s;
        }

        /* ===== КНОПКА МУЗЫКИ ===== */
        #musicBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #000000;
            box-shadow: 0 4px 0 #999999, 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            transition: all 0.08s ease-out;
        }
        #musicBtn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #999999, 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== ДОПЫ ===== */
        .chat-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            font-size: 14px;
        }
        .chat-container .msg.user { color: #00d4ff; }
        .chat-container .msg.admin { color: #ffd700; }
        .chat-container .msg .time {
            font-size: 10px;
            color: #666;
            margin-left: 10px;
        }
        .scrollable {
            max-height: 300px;
            overflow-y: auto;
        }

        /* ===== КОНКУРСНЫЙ БАННЕР ===== */
        #contestBanner {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 12px 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 18px;
        }
        #contestBanner .title {
            font-weight: 700;
            font-size: 16px;
            color: #ffd700;
        }
        #contestBanner .timer {
            font-size: 26px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
        }

        /* ===== ТАБЛИЦА ЛИДЕРОВ ===== */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        .leaderboard-table th {
            padding: 8px;
            text-align: left;
            color: #888;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .leaderboard-table td {
            padding: 8px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        @media (max-width: 420px) {
            .btn-grid { gap: 10px; }
            .btn { font-size: 13px; padding: 14px 6px; }
            .balance-item .num { font-size: 24px; }
            #app { padding: 18px 14px 22px; }
            #musicBtn {
                width: 48px;
                height: 48px;
                font-size: 20px;
                bottom: 12px;
                right: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>⭐ Забава Игра</h1>

        <div class="user-card" id="userCard">
            <span class="label">Имя</span><span class="value" id="userName">—</span>
            <span class="label">Пол</span><span class="value" id="userGender">—</span>
            <span class="label">Возраст</span><span class="value" id="userAge">—</span>
            <span class="label">ID</span><span class="value" id="userUid" onclick="copyUid()">—</span>
            <span class="label">Попытки</span><span class="value" id="userAttempts">0</span>
            <div class="full" id="userRegStatus">✅ Зарегистрирован</div>
        </div>

        <div class="balance-grid">
            <div class="balance-item"><div class="num gold" id="starsBalance">0</div><div class="lbl">⭐ Звёзды</div></div>
            <div class="balance-item"><div class="num cyan" id="bankBalance">0</div><div class="lbl">🏦 Банк</div></div>
        </div>

        <div id="contestBanner" style="display:none;"></div>

        <div class="pet-status" id="petStatus">
            <span class="stage" id="petStage">🪳 Малыш</span>
            <span class="progress" id="petProgress">0 / 100 ⭐</span>
        </div>

        <div id="codesPanel" style="display:none;">
            <div class="codes-panel" id="codesList"></div>
        </div>

        <div class="btn-grid" id="btnGrid">
            <button class="btn" id="btnPlay">🎮 Играть</button>
            <button class="btn" id="btnBank">🏦 Банк</button>
            <button class="btn" id="btnClicker">⭐ Кликер</button>
            <button class="btn" id="btnCoeff">🔥 Коэфф.</button>
            <button class="btn" id="btnPet">🪳 Питомец</button>
            <button class="btn" id="btnBuy">🛒 Попытки</button>
            <button class="btn" id="btnCode">🎫 Код</button>
            <button class="btn" id="btnLeaderboard">🏆 Лидеры</button>
            <button class="btn full small" id="btnRules">📜 Правила</button>
            <button class="btn full small danger" id="btnSupport">🆘 Поддержка</button>
            <button class="btn full small" id="btnAdmin">🔧 Админ</button>
        </div>
    </div>

    <!-- КОЛЕСО -->
    <div class="wheel-overlay" id="wheelOverlay">
        <div class="wheel-container">
            <h2>🎰 Колесо удачи</h2>
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
                <div class="wheel-center">⭐</div>
            </div>
            <div class="wheel-result" id="wheelResult">Нажмите "Крутить"!</div>
            <div class="wheel-attempts">🎮 Попыток: <strong id="wheelAttemptsCount">0</strong></div>
            <div class="wheel-actions">
                <button class="btn" id="wheelSpinBtn">🔄 Крутить</button>
                <button class="btn" id="wheelCloseBtn">✖ Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <h2 id="modalTitle">Заголовок</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="toast"></div>

    <!-- КНОПКА МУЗЫКИ -->
    <button id="musicBtn" title="Вкл/Выкл музыку">🎵</button>

    <script>
        // ============================================================
        //  МУЗЫКА
        // ============================================================
        const music = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3');
        music.loop = true;
        music.volume = 0.2;

        const musicBtn = document.getElementById('musicBtn');
        let musicOn = false;

        musicBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (musicOn) {
                music.pause();
                musicOn = false;
                musicBtn.textContent = '🎵';
                musicBtn.title = 'Включить музыку';
            } else {
                music.play().then(() => {
                    musicOn = true;
                    musicBtn.textContent = '🔇';
                    musicBtn.title = 'Выключить музыку';
                }).catch(() => {
                    alert('Не удалось запустить музыку');
                });
            }
        });

        // Автозапуск при первом клике
        document.addEventListener('click', function firstClick() {
            if (!musicOn) {
                music.play().then(() => {
                    musicOn = true;
                    musicBtn.textContent = '🔇';
                    musicBtn.title = 'Выключить музыку';
                }).catch(() => {});
            }
            document.removeEventListener('click', firstClick);
        }, { once: true });

        // ============================================================
        //  КОПИРОВАНИЕ UID
        // ============================================================
        window.copyUid = function() {
            const el = document.getElementById('userUid');
            const uid = el.textContent;
            if (!uid || uid === '—') return;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(uid).then(() => {
                    showToast('✅ UID скопирован');
                }).catch(() => {
                    fallbackCopy(uid);
                });
            } else {
                fallbackCopy(uid);
            }
        };

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            showToast('✅ UID скопирован');
        }

        // ============================================================
        //  TOAST
        // ============================================================
        window.showToast = function(text) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = text;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        };

        // ============================================================
        //  КОЛЕСО (для теста, будет переопределено game.js)
        // ============================================================
        function initWheel() {
            const canvas = document.getElementById('wheelCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const r = Math.min(w, h) / 2 - 10;
            const segments = [
                { label: 'Ничего', icon: '😔', value: 0 },
                { label: '10 ⭐', icon: '⭐', value: 10 },
                { label: '25 ⭐', icon: '⭐', value: 25 },
                { label: '50 ⭐', icon: '⭐', value: 50 },
                { label: '100 ⭐', icon: '⭐', value: 100 },
                { label: '150 ⭐', icon: '🌟', value: 150 },
                { label: '200 ⭐', icon: '🌟', value: 200 },
                { label: '300 ⭐', icon: '💎', value: 300 },
                { label: '500 ⭐', icon: '💎', value: 500 },
                { label: '1000 ⭐', icon: '👑', value: 1000 }
            ];
            const angleStep = (2 * Math.PI) / segments.length;
            
            ctx.clearRect(0, 0, w, h);
            
            segments.forEach((seg, i) => {
                const startAngle = i * angleStep;
                const endAngle = startAngle + angleStep;
                
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, startAngle, endAngle);
                ctx.closePath();
                
                ctx.fillStyle = i % 2 === 0 ? '#2a2a2a' : '#333333';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                const midAngle = startAngle + angleStep / 2;
                const tx = cx + Math.cos(midAngle) * r * 0.65;
                const ty = cy + Math.sin(midAngle) * r * 0.65;
                
                ctx.save();
                ctx.translate(tx, ty);
                ctx.rotate(midAngle);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '20px sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(seg.icon, 0, -10);
                ctx.font = '9px sans-serif';
                ctx.fillStyle = '#888888';
                ctx.fillText(seg.value > 0 ? seg.value + '⭐' : '—', 0, 16);
                ctx.restore();
            });
        }

        // ============================================================
        //  ЗАГЛУШКИ ДЛЯ КНОПОК (будут переопределены game.js)
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Инициализация колеса
            if (typeof initWheel === 'function') initWheel();
            
            // Обработчики для кнопок (заглушки)
            document.getElementById('btnPlay').addEventListener('click', function() {
                showToast('🎮 Игра загружается...');
            });
            document.getElementById('btnBank').addEventListener('click', function() {
                showToast('🏦 Банк загружается...');
            });
            document.getElementById('btnClicker').addEventListener('click', function() {
                showToast('⭐ Кликер загружается...');
            });
            document.getElementById('btnCoeff').addEventListener('click', function() {
                showToast('🔥 Коэффициент загружается...');
            });
            document.getElementById('btnPet').addEventListener('click', function() {
                showToast('🪳 Питомец загружается...');
            });
            document.getElementById('btnBuy').addEventListener('click', function() {
                showToast('🛒 Покупка загружается...');
            });
            document.getElementById('btnCode').addEventListener('click', function() {
                showToast('🎫 Код загружается...');
            });
            document.getElementById('btnLeaderboard').addEventListener('click', function() {
                showToast('🏆 Лидеры загружаются...');
            });
            document.getElementById('btnRules').addEventListener('click', function() {
                showToast('📜 Правила загружаются...');
            });
            document.getElementById('btnSupport').addEventListener('click', function() {
