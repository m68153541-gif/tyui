<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⭐ Забава Игра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1a1a2e, #0f0f1f);
            display: flex;
            justify-content: center;
            padding: 20px 12px;
            color: #f0f0ff;
        }

        #app {
            max-width: 480px;
            width: 100%;
            background: rgba(22, 22, 42, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 48px 48px 32px 32px;
            padding: 24px 20px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(249, 202, 36, 0.2);
            margin-bottom: 18px;
        }

        /* ===== КАРТОЧКА ПОЛЬЗОВАТЕЛЯ ===== */
        .user-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 16px 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }
        .user-card .label {
            font-size: 12px;
            color: #8a8ab0;
            letter-spacing: 0.3px;
        }
        .user-card .value {
            font-weight: 600;
            text-align: right;
            color: #e8e8ff;
            font-size: 14px;
            word-break: break-all;
        }
        .user-card .full {
            grid-column: span 2;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        #userUid {
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px dashed rgba(255, 215, 0, 0.3);
        }
        #userUid:hover {
            color: #ffd700;
        }

        /* ===== БАЛАНС ===== */
        .balance-grid {
            display: flex;
            gap: 14px;
            margin: 12px 0 18px;
        }
        .balance-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }
        .balance-item .num {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        .balance-item .num.gold {
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-item .num.cyan {
            background: linear-gradient(135deg, #7ed6df, #22a6b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-item .lbl {
            font-size: 12px;
            color: #8a8ab0;
            margin-top: 4px;
        }

        /* ===== ПИТОМЕЦ ===== */
        .pet-status {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 20px;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }
        .pet-status .stage {
            font-weight: 600;
        }
        .pet-status .progress {
            color: #b8b8d8;
        }

        /* ===== СЕТКА КНОПОК (ГЛАВНАЯ) ===== */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px 12px;
            margin-top: 6px;
        }

        /* ===== УНИВЕРСАЛЬНАЯ КНОПКА ===== */
        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 8px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: #2d2d4e;
            box-shadow: 0 6px 0 #1a1a2e, 0 4px 12px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.08s ease-out;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.3px;
            will-change: transform, box-shadow;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        /* Анимация мерцания для всех кнопок */
        .btn::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 42px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
            opacity: 0.3;
            transition: 0.4s;
            pointer-events: none;
        }
        .btn:hover::after {
            opacity: 0.7;
        }

        /* Нажатие — кнопка "уезжает" вниз */
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1a1a2e, 0 6px 16px rgba(0, 0, 0, 0.4);
            transition-duration: 0.04s;
        }

        /* Размеры */
        .btn.full {
            grid-column: span 3;
        }
        .btn.small {
            padding: 10px 12px;
            font-size: 13px;
        }
        .btn.danger {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            box-shadow: 0 6px 0 #87281e;
        }
        .btn.primary {
            background: linear-gradient(145deg, #f9ca24, #f0932b);
            box-shadow: 0 6px 0 #b86d1c;
            color: #1a1a2e;
        }
        .btn.blue {
            background: linear-gradient(145deg, #4a8fe0, #2d6bb8);
            box-shadow: 0 6px 0 #1a3f6e;
        }
        .btn.purple {
            background: linear-gradient(145deg, #a29bfe, #6c5ce7);
            box-shadow: 0 6px 0 #3a2f8a;
        }
        .btn.green {
            background: linear-gradient(145deg, #55efc4, #00b894);
            box-shadow: 0 6px 0 #00715a;
            color: #0f1a1a;
        }
        .btn.special {
            background: linear-gradient(145deg, #fd79a8, #e84393);
            box-shadow: 0 6px 0 #a0296a;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #1a1a2e;
            pointer-events: none;
        }

        /* ===== КОНТЕЙНЕР КОЛЕСА ===== */
        .wheel-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .wheel-overlay.active {
            display: flex;
        }
        .wheel-container {
            background: rgba(22, 22, 44, 0.95);
            border-radius: 48px;
            padding: 28px 24px 32px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            animation: scaleUp 0.25s ease;
        }
        .wheel-container h2 {
            text-align: center;
            margin-bottom: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wheel-wrapper {
            position: relative;
            margin: 0 auto;
            max-width: 320px;
        }
        #wheelCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
            cursor: pointer;
            transition: 0.3s;
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            pointer-events: none;
        }
        .wheel-result {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            padding: 12px 0 6px;
            min-height: 50px;
            color: #f0f0ff;
        }
        .wheel-attempts {
            text-align: center;
            font-size: 14px;
            color: #a0a0c0;
            margin-bottom: 10px;
        }
        .wheel-actions {
            display: flex;
            gap: 12px;
        }
        .wheel-actions .btn {
            flex: 1;
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: rgba(20, 20, 40, 0.96);
            border-radius: 40px;
            padding: 28px 24px 30px;
            max-width: 440px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: scaleUp 0.2s ease;
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 22px;
            font-weight: 600;
        }
        .modal input,
        .modal select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 12px 16px;
            color: #f0f0ff;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }
        .modal input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .modal .btn {
            margin-top: 8px;
        }

        /* ===== ТОСТ ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(10, 10, 25, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 28px;
            border-radius: 60px;
            color: #fff;
            font-weight: 500;
            font-size: 15px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 9999;
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
            text-align: center;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== КЛИКЕР ===== */
        .clicker-star {
            font-size: 72px;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
            margin: 6px 0;
        }
        .clicker-star.pop {
            animation: popStar 0.2s ease;
        }
        @keyframes popStar {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ffd700; }
            100% { transform: scale(1); }
        }
        .clicker-progress {
            width: 100%;
            height: 10px;
            background: #2a2a4a;
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
        }
        .clicker-progress .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f9ca24, #f0932b);
            border-radius: 20px;
            transition: 0.2s;
        }
        .clicker-stats {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin: 4px 0;
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== ДОП. ЭЛЕМЕНТЫ ===== */
        .chat-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 12px;
            margin: 8px 0;
            font-size: 14px;
        }
        .chat-container .msg {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .chat-container .msg.user { color: #7ed6df; }
        .chat-container .msg.admin { color: #ffd700; }
        .chat-container .msg .time {
            font-size: 10px;
            color: #666;
            margin-left: 10px;
        }
        .admin-panel .btn {
            font-size: 13px;
            padding: 10px 6px;
        }
        .scrollable {
            max-height: 300px;
            overflow-y: auto;
        }

        /* ===== КОНКУРСНЫЙ БАННЕР ===== */
        #contestBanner {
            background: linear-gradient(135deg, rgba(249, 202, 36, 0.12), rgba(240, 147, 43, 0.08));
            border-radius: 40px;
            padding: 12px 18px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.15);
            margin-bottom: 18px;
            backdrop-filter: blur(4px);
        }
        #contestBanner .title {
            font-weight: 700;
            font-size: 16px;
            color: #ffd700;
        }
        #contestBanner .timer {
            font-size: 26px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #fff;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .btn-grid { gap: 10px; }
            .btn { font-size: 13px; padding: 12px 6px; }
            .balance-item .num { font-size: 24px; }
            #app { padding: 18px 14px 22px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>⭐ Забава Игра</h1>

        <div class="user-card" id="userCard">
            <span class="label">Имя</span><span class="value" id="userName">—</span>
            <span class="label">Пол</span><span class="value" id="userGender">—</span>
            <span class="label">Возраст</span><span class="value" id="userAge">—</span>
            <span class="label">ID</span><span class="value" id="userUid" onclick="copyUid()">—</span>
            <span class="label">Попытки</span><span class="value" id="userAttempts">0</span>
            <div class="full" id="userRegStatus">✅ Зарегистрирован</div>
        </div>

        <div class="balance-grid">
            <div class="balance-item"><div class="num gold" id="starsBalance">0</div><div class="lbl">⭐ Звёзды</div></div>
            <div class="balance-item"><div class="num cyan" id="bankBalance">0</div><div class="lbl">🏦 Банк</div></div>
        </div>

        <div id="contestBanner" style="display:none;"></div>

        <div class="pet-status" id="petStatus">
            <span class="stage" id="petStage">🪳 Малыш</span>
            <span class="progress" id="petProgress">0 / 100 ⭐</span>
        </div>

        <div id="codesPanel" style="display:none;">
            <div class="codes-panel" id="codesList"></div>
        </div>

        <div class="btn-grid">
            <button class="btn primary" id="btnPlay">🎮 Играть</button>
            <button class="btn blue" id="btnBank">🏦 Банк</button>
            <button class="btn special" id="btnClicker">⭐ Кликер</button>
            <button class="btn purple" id="btnCoeff">🔥 Коэфф.</button>
            <button class="btn green" id="btnPet">🪳 Питомец</button>
            <button class="btn green" id="btnBuy">🛒 Попытки</button>
            <button class="btn" id="btnCode" style="background:linear-gradient(145deg,#00b894,#00a381);box-shadow:0 6px 0 #00715a;">🎫 Код</button>
            <button class="btn" id="btnLeaderboard" style="background:linear-gradient(145deg,#6c5ce7,#4a3db8);box-shadow:0 6px 0 #3a2f8a;">🏆 Лидеры</button>
            <button class="btn full small" id="btnRules">📜 Правила</button>
            <button class="btn full small" id="btnSupport">🆘 Поддержка</button>
            <button class="btn full small danger" id="btnAdmin">🔧 Админ</button>
        </div>
    </div>

    <!-- КОЛЕСО -->
    <div class="wheel-overlay" id="wheelOverlay">
        <div class="wheel-container">
            <h2>🎰 Колесо удачи</h2>
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
                <div class="wheel-center">⭐</div>
            </div>
            <div class="wheel-result" id="wheelResult">Нажмите "Крутить"!</div>
            <div class="wheel-attempts">🎮 Попыток: <strong id="wheelAttemptsCount">0</strong></div>
            <div class="wheel-actions">
                <button class="btn primary" id="wheelSpinBtn">🔄 Крутить</button>
                <button class="btn" id="wheelCloseBtn">✖ Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <h2 id="modalTitle">Заголовок</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // ============================================================
        //  ПОЛНОСТЬЮ ВАША ЛОГИКА (без изменений)
        //  ВНИМАНИЕ: весь JS-код из вашего game.js вставлен сюда,
        //  но для краткости я оставлю ссылку на ваш исходный скрипт.
        //  В реальном проекте вы просто подключаете game.js
        // ============================================================
        // (Здесь должен быть ваш game.js, но я его не дублирую,
        //  чтобы не раздувать ответ. Вы подключите его отдельно.
        //  Все функции остаются без изменений.)
        // ============================================================

        // ДЛЯ ПРИМЕРА — минимальный полифил, чтобы страница не падала
        // (В вашем проекте game.js заменит это)
        console.log('🚀 Графика обновлена! Анимации кнопок и фон переделаны.');

        // Просто чтобы кнопки имели эффект — уже в CSS.
        // Дополнительно: обработчик для копирования UID
        window.copyUid = function() {
            const el = document.getElementById('userUid');
            const uid = el.textContent;
            if (!uid || uid === '—') return;
            navigator.clipboard?.writeText(uid)?.then(() => {
                showToast('✅ UID скопирован');
            })?.catch(() => {
                const ta = document.createElement('textarea');
                ta.value = uid;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showToast('✅ UID скопирован');
            });
        };

        // Заглушка для showToast (ваша функция из game.js переопределит)
        window.showToast = function(text) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = text;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        };

        // Имитация загрузки (ваш game.js всё подхватит)
        document.addEventListener('DOMContentLoaded', function() {
            // Инициализация колеса (ваша функция)
            if (typeof initWheel === 'function') initWheel();
            // Рендер
            if (typeof render === 'function') render();
            console.log('✅ DOM + стили с анимациями загружены');
        });
    </script>
    <!-- ВАШ ОСНОВНОЙ СКРИПТ (game.js) ПОДКЛЮЧАЕТСЯ ЗДЕСЬ -->
    <script src="game.js"></script>
</body>
</html>
