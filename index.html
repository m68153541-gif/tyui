<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⭐ Забава Игра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0515;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* ===== КОСМИЧЕСКИЙ ФОН ===== */
        #backgroundCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== ЭКРАН ЗАГРУЗКИ ===== */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0515;
            transition: opacity 0.8s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loadingScreen .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            background: rgba(108, 92, 231, 0.15);
            box-shadow: 0 0 60px rgba(108, 92, 231, 0.3);
            animation: pulseLogo 1.5s ease-in-out infinite;
            margin-bottom: 30px;
            border: 2px solid rgba(108, 92, 231, 0.2);
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(108, 92, 231, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 80px rgba(108, 92, 231, 0.5); }
        }

        #loadingScreen h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7, #fd79a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .loading-bar-container {
            width: 300px;
            max-width: 80%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe, #fd79a8);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .loading-text {
            margin-top: 12px;
            font-size: 16px;
            color: #a0a0c0;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .loading-percent {
            font-weight: 700;
            color: #a29bfe;
        }

        /* ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== */
        #app {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
            background: rgba(20, 16, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px 48px 32px 32px;
            padding: 24px 20px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #app.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7, #fd79a8);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradShift 4s ease-in-out infinite alternate;
            margin-bottom: 18px;
        }
        @keyframes gradShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* ===== КАРТОЧКА ===== */
        .user-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 16px 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }
        .user-card .label {
            font-size: 12px;
            color: #8a8ab0;
            letter-spacing: 0.3px;
        }
        .user-card .value {
            font-weight: 600;
            text-align: right;
            color: #ffffff;
            font-size: 14px;
            word-break: break-all;
        }
        .user-card .full {
            grid-column: span 2;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        #userUid {
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
        }
        #userUid:hover {
            color: #a29bfe;
        }

        /* ===== БАЛАНС ===== */
        .balance-grid {
            display: flex;
            gap: 14px;
            margin: 12px 0 18px;
        }
        .balance-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }
        .balance-item .num {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        .balance-item .num.gold {
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-item .num.cyan {
            background: linear-gradient(135deg, #7ed6df, #22a6b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-item .lbl {
            font-size: 12px;
            color: #8a8ab0;
            margin-top: 4px;
        }

        /* ===== ПИТОМЕЦ ===== */
        .pet-status {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }

        /* ===== КНОПКИ (ПРОЗРАЧНЫЕ С ОБВОДКОЙ) ===== */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px 12px;
            margin-top: 6px;
        }

        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            letter-spacing: 0.3px;
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.05);
        }

        .btn:hover {
            border-color: rgba(162, 155, 254, 0.6);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 40px rgba(108, 92, 231, 0.15);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(2px) scale(0.97);
            transition-duration: 0.08s;
        }

        .btn.danger {
            border-color: rgba(231, 76, 60, 0.5);
            background: rgba(231, 76, 60, 0.1);
        }
        .btn.danger:hover {
            border-color: rgba(231, 76, 60, 0.8);
            background: rgba(231, 76, 60, 0.15);
            box-shadow: 0 0 40px rgba(231, 76, 60, 0.15);
        }

        .btn.full {
            grid-column: span 3;
        }
        .btn.small {
            padding: 12px 10px;
            font-size: 13px;
        }
        .btn:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            pointer-events: none;
        }

        /* ===== КОЛЕСО ===== */
        .wheel-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .wheel-overlay.active {
            display: flex;
        }
        .wheel-container {
            background: rgba(20, 16, 40, 0.95);
            border-radius: 48px;
            padding: 28px 24px 32px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            animation: scaleUp 0.25s ease;
        }
        .wheel-container h2 {
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wheel-wrapper {
            position: relative;
            margin: 0 auto;
            max-width: 320px;
        }
        #wheelCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(108, 92, 231, 0.1);
            cursor: pointer;
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            text-shadow: 0 0 30px rgba(162, 155, 254, 0.3);
            pointer-events: none;
        }
        .wheel-result {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            padding: 12px 0 6px;
            min-height: 50px;
            color: #ffffff;
        }
        .wheel-actions {
            display: flex;
            gap: 12px;
        }
        .wheel-actions .btn {
            flex: 1;
        }

        /* ===== МОДАЛКА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: rgba(20, 16, 40, 0.96);
            border-radius: 40px;
            padding: 28px 24px 30px;
            max-width: 440px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: scaleUp 0.2s ease;
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 22px;
            color: #ffffff;
        }
        .modal input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }
        .modal input:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 20px rgba(162, 155, 254, 0.1);
        }
        .modal .btn {
            margin-top: 8px;
        }

        /* ===== ТОСТ ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(20, 16, 40, 0.95);
            backdrop-filter: blur(12px);
            padding: 14px 28px;
            border-radius: 16px;
            color: #ffffff;
            font-weight: 500;
            font-size: 15px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 9999;
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
            text-align: center;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== КЛИКЕР ===== */
        .clicker-star {
            font-size: 72px;
            cursor: pointer;
            user-select: none;
            margin: 6px 0;
            transition: 0.1s;
        }
        .clicker-star.pop {
            animation: popStar 0.2s ease;
        }
        @keyframes popStar {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #a29bfe; }
            100% { transform: scale(1); }
        }
        .clicker-progress {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
        }
        .clicker-progress .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            border-radius: 20px;
            transition: 0.2s;
        }

        /* ===== КНОПКА МУЗЫКИ ===== */
        #musicBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ffffff;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            transition: all 0.3s ease;
        }
        #musicBtn:hover {
            border-color: rgba(162, 155, 254, 0.6);
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
        }
        #musicBtn:active {
            transform: scale(0.95);
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== ДОПЫ ===== */
        .chat-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            font-size: 14px;
        }
        .chat-container .msg.user { color: #7ed6df; }
        .chat-container .msg.admin { color: #a29bfe; }
        .chat-container .msg .time {
            font-size: 10px;
            color: #666;
            margin-left: 10px;
        }
        .scrollable {
            max-height: 300px;
            overflow-y: auto;
        }

        /* ===== КОНКУРСНЫЙ БАННЕР ===== */
        #contestBanner {
            background: rgba(108, 92, 231, 0.1);
            border-radius: 40px;
            padding: 12px 18px;
            text-align: center;
            border: 1px solid rgba(108, 92, 231, 0.15);
            margin-bottom: 18px;
        }
        #contestBanner .title {
            font-weight: 700;
            font-size: 16px;
            color: #a29bfe;
        }
        #contestBanner .timer {
            font-size: 26px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
        }

        /* ===== ТАБЛИЦА ===== */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        .leaderboard-table th {
            padding: 8px;
            text-align: left;
            color: #8a8ab0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .leaderboard-table td {
            padding: 8px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        @media (max-width: 420px) {
            .btn-grid { gap: 10px; }
            .btn { font-size: 13px; padding: 14px 6px; }
            .balance-item .num { font-size: 24px; }
            #app { padding: 18px 14px 22px; }
            #musicBtn {
                width: 48px;
                height: 48px;
                font-size: 20px;
                bottom: 12px;
                right: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- КОСМИЧЕСКИЙ ФОН -->
    <canvas id="backgroundCanvas"></canvas>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loadingScreen">
        <div class="logo">⭐</div>
        <h2>Забава Игра</h2>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
        <div class="loading-text">
            Загрузка... <span class="loading-percent" id="loadingPercent">0%</span>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="app">
        <h1>⭐ Забава Игра</h1>

        <div class="user-card" id="userCard">
            <span class="label">Имя</span><span class="value" id="userName">—</span>
            <span class="label">Пол</span><span class="value" id="userGender">—</span>
            <span class="label">Возраст</span><span class="value" id="userAge">—</span>
            <span class="label">ID</span><span class="value" id="userUid" onclick="copyUid()">—</span>
            <span class="label">Попытки</span><span class="value" id="userAttempts">0</span>
            <div class="full" id="userRegStatus">✅ Зарегистрирован</div>
        </div>

        <div class="balance-grid">
            <div class="balance-item"><div class="num gold" id="starsBalance">0</div><div class="lbl">⭐ Звёзды</div></div>
            <div class="balance-item"><div class="num cyan" id="bankBalance">0</div><div class="lbl">🏦 Банк</div></div>
        </div>

        <div id="contestBanner" style="display:none;"></div>

        <div class="pet-status" id="petStatus">
            <span class="stage" id="petStage">🪳 Малыш</span>
            <span class="progress" id="petProgress">0 / 100 ⭐</span>
        </div>

        <div id="codesPanel" style="display:none;">
            <div class="codes-panel" id="codesList"></div>
        </div>

        <div class="btn-grid" id="btnGrid">
            <button class="btn" id="btnPlay">🎮 Играть</button>
            <button class="btn" id="btnBank">🏦 Банк</button>
            <button class="btn" id="btnClicker">⭐ Кликер</button>
            <button class="btn" id="btnCoeff">🔥 Коэфф.</button>
            <button class="btn" id="btnPet">🪳 Питомец</button>
            <button class="btn" id="btnBuy">🛒 Попытки</button>
            <button class="btn" id="btnCode">🎫 Код</button>
            <button class="btn" id="btnLeaderboard">🏆 Лидеры</button>
            <button class="btn full small" id="btnRules">📜 Правила</button>
            <button class="btn full small danger" id="btnSupport">🆘 Поддержка</button>
            <button class="btn full small" id="btnAdmin">🔧 Админ</button>
        </div>
    </div>

    <!-- КОЛЕСО -->
    <div class="wheel-overlay" id="wheelOverlay">
        <div class="wheel-container">
            <h2>🎰 Колесо удачи</h2>
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
                <div class="wheel-center">⭐</div>
            </div>
            <div class="wheel-result" id="wheelResult">Нажмите "Крутить"!</div>
            <div class="wheel-attempts">🎮 Попыток: <strong id="wheelAttemptsCount">0</strong></div>
            <div class="wheel-actions">
                <button class="btn" id="wheelSpinBtn">🔄 Крутить</button>
                <button class="btn" id="wheelCloseBtn">✖ Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <h2 id="modalTitle">Заголовок</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="toast"></div>

    <!-- КНОПКА МУЗЫКИ -->
    <button id="musicBtn" title="Вкл/Выкл музыку">🎵</button>

    <script>
        // ============================================================
        //  КОСМИЧЕСКИЙ ФОН (звёзды)
        // ============================================================
        const canvas = document.getElementById('backgroundCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let starCount = 200;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.3 + 0.1,
                    opacity: Math.random() * 0.8 + 0.2
                });
            }
        }
        createStars();

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Градиентный фон
            const gradient = ctx.createRadialGradient(
                canvas.width * 0.3, canvas.height * 0.2, 100,
                canvas.width * 0.5, canvas.height * 0.5, canvas.width * 0.8
            );
            gradient.addColorStop(0, '#1a0e3e');
            gradient.addColorStop(0.5, '#0a0515');
            gradient.addColorStop(1, '#050210');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Звёзды с мерцанием
            stars.forEach(star => {
                const twinkle = Math.sin(Date.now() / 2000 * star.speed * 2 + star.x) * 0.3 + 0.7;
                const opacity = star.opacity * twinkle;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.fill();
                
                // Большие звёзды с сиянием
                if (star.radius > 1.5) {
                    ctx.shadowColor = `rgba(162, 155, 254, ${opacity * 0.2})`;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
            
            // Падающие звёзды
            if (Math.random() < 0.002) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.3;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + 50, y + 50);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // ============================================================
        //  ЗАГРУЗКА
        // ============================================================
        const loadingScreen = document.getElementById('loadingScreen');
        const loadingBar = document.getElementById('loadingBar');
        const loadingPercent = document.getElementById('loadingPercent');
        const app = document.getElementById('app');
        
        let progress = 0;
        const loadingInterval = setInterval(() => {
            progress += Math.random() * 3 + 1;
            if (progress > 100) progress = 100;
            
            loadingBar.style.width = progress + '%';
            loadingPercent.textContent = Math.floor(progress) + '%';
            
            if (progress >= 100) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => {
                        app.classList.add('show');
                    }, 300);
                }, 500);
            }
        }, 80);

        // ============================================================
        //  МУЗЫКА
        // ============================================================
        const music = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3');
        music.loop = true;
        music.volume = 0.2;

        const musicBtn = document.getElementById('musicBtn');
        let musicOn = false;

        musicBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (musicOn) {
                music.pause();
                musicOn = false;
                musicBtn.textContent = '🎵';
                musicBtn.title = 'Включить музыку';
            } else {
                music.play().then(() => {
                    musicOn = true;
                    musicBtn.textContent = '🔇';
                    musicBtn.title = 'Выключить музыку';
                }).catch(() => {});
            }
        });

        // ============================================================
        //  КОПИРОВАНИЕ UID
        // ============================================================
        window.copyUid = function() {
            const el = document.getElementById('userUid');
            const uid = el.textContent;
            if (!uid || uid === '—') return;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(uid).then(() => {
                    showToast('✅ UID скопирован');
                }).catch(() => {
                    fallbackCopy(uid);
                });
            } else {
                fallbackCopy(uid);
            }
        };

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            showToast('✅ UID скопирован');
        }

        // ============================================================
        //  TOAST
        // ============================================================
        window.showToast = function(text) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = text;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        };

        // ============================================================
        //  ЗАГРУЗКА GAME.JS
        // ============================================================
        function loadGameScript() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'game.js';
                script.onload = () => {
                    console.log('game.js загружен');
                    resolve();
                };
                script.onerror = () => {
                    console.error('Ошибка загрузки game.js');
                    reject();
                };
                document.body.appendChild(script);
            });
        }

        // Ждём появления меню и загружаем game.js
        const appObserver = new MutationObserver(async () => {
            if (app.classList.contains('show')) {
                appObserver.disconnect();
                console.log('Меню появилось, загружаем game.js...');
                try {
                    await loadGameScript();
                    console.log('game.js загружен, инициализация...');
                    // Даём время на инициализацию
                    setTimeout(() => {
                        if (typeof render === 'function') {
                            render();
                        }
                        if (typeof initWheel === 'function') {
                            initWheel();
                        }
                        console.log('Игра готова!');
                    }, 100);
                } catch(e) {
                    console.error('Ошибка загрузки game.js:', e);
                }
            }
        });

        appObserver.observe(app, { attributes: true, attributeFilter: ['class'] });

        // Если загрузка game.js не удалась - используем встроенную логику
        setTimeout(() => {
            if (!document.querySelector('script[src="game.js"]')) {
                console.log('game.js не загружен, пробуем ещё раз...');
                loadGameScript().then(() => {
                    setTimeout(() => {
                        if (typeof render === 'function') render();
                        if (typeof initWheel === 'function') initWheel();
                    }, 100);
                });
            }
        }, 5000);

        console.log('Готово, ожидаем загрузки game.js');
    </script>
</body>
</html>
