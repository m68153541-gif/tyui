<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🦄 Забава Игра</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Основные стили, оставляю только важные части для краткости, вставьте все свои стили сюда */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, 'Comic Sans MS', system-ui, sans-serif;
}
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff6b9d, #ff2e63, #ff6b9d);
    background-size: 200% 200%;
    animation: bgGradient 6s ease-in-out infinite;
    display: flex;
    justify-content: center;
    padding: 20px 12px;
    color: #ffffff;
    overflow-y: auto;
    position: relative;
}
/* Остальные стили — вставьте сюда все ваши стили, как было раньше */
@keyframes bgGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
#loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff6b9d, #ff2e63, #ff6b9d);
    background-size: 200% 200%;
    animation: bgGradient 4s ease-in-out infinite;
}
#loadingScreen.hidden {
    opacity: 0;
    pointer-events: none;
}
#loadingScreen .logo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 80px rgba(255, 105, 180, 0.5);
    animation: pulseLogo 1.5s ease-in-out infinite;
    margin-bottom: 30px;
    border: 3px solid rgba(255, 255, 255, 0.2);
}
@keyframes pulseLogo {
    0%, 100% { transform: scale(1) rotate(-5deg); box-shadow: 0 0 80px rgba(255, 105, 180, 0.5); }
    50% { transform: scale(1.08) rotate(5deg); box-shadow: 0 0 120px rgba(255, 105, 180, 0.8); }
}
#loadingScreen h2 {
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 40px rgba(255, 105, 180, 0.3);
    margin-bottom: 20px;
}
.loading-bar-container {
    width: 300px;
    max-width: 80%;
    height: 12px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    overflow: hidden;
}
.loading-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff6b9d, #ff2e63, #ffd93d, #ff6b9d);
    background-size: 300% 100%;
    animation: loadingGradient 2s linear infinite;
    border-radius: 20px;
}
@keyframes loadingGradient {
    0% { background-position: 0% 0%; }
    100% { background-position: 300% 0%; }
}
.loading-text {
    margin-top: 12px;
    font-size: 18px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
    letter-spacing: 1px;
}
.loading-percent {
    font-weight: 700;
    color: #ffd93d;
}
#app {
    position: relative;
    z-index: 1;
    max-width: 500px;
    width: 100%;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 48px 48px 32px 32px;
    padding: 24px 20px 30px;
    box-shadow: 0 20px 60px rgba(255, 105, 180, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    opacity: 0;
    transform: translateY(30px) scale(0.95);
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    margin-bottom: 80px;
}
#app.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}
h1 {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 0 40px rgba(255, 105, 180, 0.3);
    margin-bottom: 18px;
}
/* Остальные ваши стили — пропущены для краткости, вставьте свои полностью сюда */
#musicBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255, 255, 255, 0.2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #ffffff;
    box-shadow: 0 4px 30px rgba(255, 105, 180, 0.3);
    z-index: 9999;
    transition: all 0.3s ease;
}
#musicBtn:hover {
    transform: scale(1.1);
    border-color: rgba(255, 255, 255, 0.4);
}
#musicBtn:active {
    transform: scale(0.95);
}
/* остальные стили — пропущены */
</style>
</head>
<body>
<!-- остальные элементы — пропущены для краткости, вставьте свои полностью -->

<div id="sparklesContainer"></div>
<div id="loadingScreen">...</div>
<div id="app">...</div>
<div class="wheel-overlay">...</div>
<div class="modal-overlay">...</div>
<div id="toast"></div>

<!-- Кнопка для музыки -->
<button id="musicBtn" title="Вкл/Выкл музыку">🎵</button>

<script>
/* Ваш существующий скрипт, дополнительно добавим музыку */

const sparklesContainer = document.getElementById('sparklesContainer');
// ... остальной ваш код по блесткам и загрузке

// =================== МУЗЫКА ===================
// Используем более хорошую музыку с тематикой единорогов
const music = new Audio('https://cdn.pixabay.com/download/audio/2022/12/23/audio_4f7d7f4e7b.mp3?filename=happy-unicorn-party.mp3');
music.loop = true;
music.volume = 0.2;

const musicBtn = document.getElementById('musicBtn');
let musicOn = false;

musicBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (musicOn) {
        music.pause();
        musicOn = false;
        musicBtn.textContent = '🎵';
        musicBtn.title = 'Включить музыку';
    } else {
        music.play().then(() => {
            musicOn = true;
            musicBtn.textContent = '🔊';
            musicBtn.title = 'Выключить музыку';
        }).catch(() => {
            showToast('Ошибка воспроизведения музыки');
        });
    }
});

// Остальной ваш код (копирование UID, тосты, загрузка скриптов)
window.showToast = function(text) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
};

function loadGameScript() {
    if (document.querySelector('script[src="game.js"]')) {
        console.log('game.js уже загружен');
        return;
    }
    console.log('Загружаем game.js...');
    const script = document.createElement('script');
    script.src = 'game.js';
    script.onload = () => console.log('game.js успешно загружен');
    script.onerror = () => {
        console.error('Ошибка загрузки game.js');
        setTimeout(loadGameScript, 2000);
    };
    document.head.appendChild(script);
}

console.log('✨ Добро пожаловать в розовую сказку! 🦄');
</script>
</body>
</html>
