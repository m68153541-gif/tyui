<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⭐ Забава Игра</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
<style>
/* Стиль панели управления музыкой */
#musicControl {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.7);
    padding: 10px 15px;
    border-radius: 8px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: sans-serif;
    font-size: 14px;
    color: #fff;
}
#musicToggle {
    cursor: pointer;
    padding: 5px 10px;
    border: none;
    border-radius: 4px;
    background-color: #4CAF50;
    color: white;
    font-weight: bold;
}
</style>
</head>
<body>
<!-- Панель управления музыкой -->
<div id="musicControl">
    <button id="musicToggle">🔊 Включить музыку</button>
</div>

<div id="app">
    <h1>⭐ Забава Игра</h1>
    <!-- Остальной ваш контент -->
    <!-- ... (ваш остальной HTML-код без изменений) ... -->
</div>

<!-- Колесо удачи, модалки, и остальные элементы остаются без изменений -->

<script src="game.js"></script>

<!-- Скрипт управления музыкой -->
<script>
const music = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
music.loop = true;
music.volume = 0.2;

const clickSound = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');
clickSound.volume = 0.5;

let isMusicPlaying = false;
const musicBtn = document.getElementById('musicToggle');

function toggleMusic() {
    if (isMusicPlaying) {
        music.pause();
        isMusicPlaying = false;
        musicBtn.textContent = '🔊 Включить музыку';
    } else {
        music.play().then(() => {
            isMusicPlaying = true;
            musicBtn.textContent = '🔇 Выключить музыку';
        }).catch(() => {
            alert('Не удалось запустить музыку. Попробуйте снова.');
        });
    }
}

// Попытка запустить музыку при первом клике
document.addEventListener('click', () => {
    if (!isMusicPlaying) {
        music.play().then(() => {
            isMusicPlaying = true;
            musicBtn.textContent = '🔇 Выключить музыку';
        }).catch(() => {
            console.log('Не удалось запустить музыку');
        });
    }
}, { once: true });

// Обработчик для кнопки
document.getElementById('musicToggle').addEventListener('click', toggleMusic);

// Воспроизведение звука при клике по любой кнопке
document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
        clickSound.currentTime = 0;
        clickSound.play();
    });
});
</script>
</body>
</html>
