<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⭐ Забава Игра</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
<style>
/* Общие стили */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    position: relative;
}

/* Круглая кнопка для музыки */
#musicButton {
    position: fixed;
    bottom: 20px; /* снизу */
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-color: #4CAF50;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: white;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 9999;
    transition: background-color 0.3s;
}
#musicButton:hover {
    background-color: #45a049;
}

/* Стиль для админки (пример) */
#admin {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #222;
    color: #fff;
    padding: 10px;
    text-align: center;
}
</style>
</head>
<body>
<!-- Кнопка включения/выключения музыки -->
<button id="musicButton" title="Вкл/Выкл музыку">🎵</button>

<!-- Ваша основная часть -->
<div id="app">
    <h1>⭐ Забава Игра</h1>
    <!-- Остальной ваш контент, колесо, модалки и т.д. -->
</div>

<!-- Админка внизу -->
<div id="admin">
    <strong>Админка</strong>
</div>

<script src="game.js"></script>

<!-- Скрипт управления музыкой -->
<script>
const music = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3');
music.loop = true;
music.volume = 0.2;

const clickSound = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');
clickSound.volume = 0.5;

let isMusicPlaying = false;
const musicBtn = document.getElementById('musicButton');

function toggleMusic() {
    if (isMusicPlaying) {
        music.pause();
        isMusicPlaying = false;
        musicBtn.textContent = '🎵'; // иконка музыка
        musicBtn.title = 'Включить музыку';
    } else {
        music.play().then(() => {
            isMusicPlaying = true;
            musicBtn.textContent = '🔇'; // иконка без звука
            musicBtn.title = 'Выключить музыку';
        }).catch(() => {
            alert('Не удалось запустить музыку. Попробуйте снова.');
        });
    }
}

// Попытка запустить музыку при первом клике
document.addEventListener('click', () => {
    if (!isMusicPlaying) {
        music.play().then(() => {
            isMusicPlaying = true;
            musicBtn.textContent = '🔇';
            musicBtn.title = 'Выключить музыку';
        }).catch(() => {
            console.log('Не удалось запустить музыку');
        });
    }
}, { once: true });

// Обработчик для кнопки
document.getElementById('musicButton').addEventListener('click', toggleMusic);

// Воспроизведение звука при клике по любой кнопке
document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
        clickSound.currentTime = 0;
        clickSound.play();
    });
});
</script>
</body>
</html>
