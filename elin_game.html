<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌟 Элин - Спасители звёзд</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0515, #1a0e3e, #0a0515);
            background-size: 300% 300%;
            animation: heroBgGradient 6s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #ffffff;
            overflow: hidden;
        }

        @keyframes heroBgGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes sparkleFall {
            0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(50px) rotate(720deg); opacity: 0; }
        }

        @keyframes elinFall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(calc(100% + 50px)) rotate(720deg); opacity: 0; }
        }

        @keyframes elinCatch {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 0 60px rgba(255,105,180,0.3); }
            50% { box-shadow: 0 0 80px rgba(255,105,180,0.6); }
        }

        .bg-star {
            position: fixed;
            color: rgba(255, 255, 255, 0.05);
            font-size: 20px;
            animation: sparkleFall linear infinite;
            pointer-events: none;
        }

        #topPanel {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
            margin-bottom: 15px;
        }

        #topPanel .timer { color: #fff; font-weight: 700; }
        #topPanel .score { color: #ffd93d; font-weight: 700; font-size: 20px; }

        #starsContainer {
            width: 100%;
            max-width: 500px;
            flex: 1;
            position: relative;
            border-radius: 30px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 400px;
        }

        .falling-star {
            position: absolute;
            cursor: pointer;
            z-index: 1;
            user-select: none;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: elinFall 3s linear forwards;
            transition: transform 0.1s;
            font-size: 30px;
        }

        .falling-star.caught {
            animation: elinCatch 0.3s ease forwards;
        }

        #startBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 50px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff6b9d, #ff2e63);
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 0 60px rgba(255, 105, 180, 0.3);
            animation: pulseBtn 2s ease-in-out infinite;
            transition: transform 0.3s;
        }

        #startBtn:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        #backBtn {
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #backBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .result-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 280px;
        }

        .result-overlay .big { font-size: 60px; margin-bottom: 15px; }
        .result-overlay .title { font-size: 28px; font-weight: 700; }
        .result-overlay .title.win { color: #ffd93d; }
        .result-overlay .title.lose { color: #ff4757; }
        .result-overlay .desc { font-size: 18px; color: rgba(255,255,255,0.8); margin: 10px 0; }
        .result-overlay .reward { font-size: 16px; color: #7ed6df; margin: 10px 0; }

        .btn-result {
            margin-top: 15px;
            padding: 12px 40px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn-result:hover {
            transform: scale(1.05);
        }

        .btn-result.win {
            background: linear-gradient(135deg, #ffd93d, #f0932b);
            color: #1a1a2e;
        }

        .btn-result.retry {
            background: linear-gradient(135deg, #ff6b9d, #ff2e63);
            color: #fff;
        }

        .btn-result.exit {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        @media (max-width: 420px) {
            #topPanel { padding: 12px 15px; }
            #topPanel .score { font-size: 16px; }
            #topPanel .timer { font-size: 14px; }
            #startBtn { font-size: 18px; padding: 15px 30px; }
            .result-overlay { padding: 25px; min-width: 200px; }
            .result-overlay .big { font-size: 40px; }
            .result-overlay .title { font-size: 22px; }
            .falling-star { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- Фоновые звёзды -->
    <div id="bgStars"></div>

    <!-- Верхняя панель -->
    <div id="topPanel">
        <div class="timer">⏱️ <span id="timerDisplay">03:00</span></div>
        <div class="score">⭐ <span id="scoreDisplay">0</span> / 150</div>
        <button id="backBtn">✖</button>
    </div>

    <!-- Контейнер для звёзд -->
    <div id="starsContainer">
        <button id="startBtn">🌟 НАЧАТЬ</button>
    </div>

    <script>
        // ============================================================
        //  ФОНОВЫЕ ЗВЁЗДЫ
        // ============================================================
        const bgContainer = document.getElementById('bgStars');
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'bg-star';
            star.textContent = '✦';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.fontSize = (Math.random() * 15 + 10) + 'px';
            star.style.animationDuration = (Math.random() * 20 + 15) + 's';
            star.style.animationDelay = (Math.random() * 10) + 's';
            bgContainer.appendChild(star);
        }

        // ============================================================
        //  ИГРОВЫЕ ПЕРЕМЕННЫЕ
        // ============================================================
        let gameInterval = null;
        let starCreationInterval = null;
        let stars = [];
        let collected = 0;
        let timeLeft = 180;
        let gameActive = false;
        let gameOver = false;

        const container = document.getElementById('starsContainer');
        const startBtn = document.getElementById('startBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const backBtn = document.getElementById('backBtn');

        // ============================================================
        //  ОБНОВЛЕНИЕ ТАЙМЕРА
        // ============================================================
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            timerDisplay.style.color = timeLeft < 30 ? '#ff4757' : '#ffffff';
        }

        // ============================================================
        //  СОЗДАНИЕ ЗВЕЗДЫ
        // ============================================================
        function createStar() {
            if (!gameActive || gameOver) return;

            const existing = container.querySelectorAll('.falling-star');
            if (existing.length > 40) return;

            const star = document.createElement('div');
            star.className = 'falling-star';
            const emojis = ['⭐', '🌟', '✨', '💫'];
            star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            star.style.left = (Math.random() * 90 + 5) + '%';
            star.style.top = '-30px';
            star.style.fontSize = (Math.random() * 20 + 20) + 'px';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.dataset.caught = 'false';

            star.onclick = function(e) {
                e.stopPropagation();
                if (this.dataset.caught === 'true') return;
                if (!gameActive || gameOver) return;

                this.dataset.caught = 'true';
                this.classList.add('caught');
                collected++;
                scoreDisplay.textContent = collected;

                this.style.color = '#ffd93d';
                this.style.textShadow = '0 0 40px rgba(255,215,0,0.8)';

                setTimeout(() => { if (this.parentNode) this.remove(); }, 300);

                if (collected >= 150) {
                    endGame(true);
                }
            };

            container.appendChild(star);
            stars.push(star);

            setTimeout(() => {
                if (star.parentNode && star.dataset.caught === 'false') {
                    star.remove();
                    const index = stars.indexOf(star);
                    if (index > -1) stars.splice(index, 1);
                }
            }, 5000);
        }

        // ============================================================
        //  ЗАПУСК ИГРЫ
        // ============================================================
        function startGame() {
            if (gameActive) return;

            // Удаляем кнопку "Начать"
            if (startBtn) startBtn.remove();

            // Сбрасываем состояние
            collected = 0;
            timeLeft = 180;
            gameActive = true;
            gameOver = false;
            stars = [];
            scoreDisplay.textContent = '0';
            updateTimer();

            // Удаляем старые звёзды
            document.querySelectorAll('.falling-star').forEach(s => s.remove());

            // Таймер
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);

            // Создание звёзд
            if (starCreationInterval) clearInterval(starCreationInterval);
            starCreationInterval = setInterval(() => {
                if (gameActive && !gameOver) createStar();
            }, 400);

            // Начальные звёзды
            for (let i = 0; i < 15; i++) {
                setTimeout(() => createStar(), i * 200);
            }

            // Убираем старые результаты
            const oldResult = container.querySelector('.result-overlay');
            if (oldResult) oldResult.remove();
        }

        // ============================================================
        //  ЗАВЕРШЕНИЕ ИГРЫ
        // ============================================================
        function endGame(won) {
            if (gameOver) return;
            gameOver = true;
            gameActive = false;

            if (gameInterval) { clearInterval(gameInterval); gameInterval = null; }
            if (starCreationInterval) { clearInterval(starCreationInterval); starCreationInterval = null; }

            // Удаляем все звёзды
            document.querySelectorAll('.falling-star').forEach(s => s.remove());
            stars = [];

            // Создаём результат
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-overlay';

            if (won) {
                // Сохраняем прогресс в localStorage
                try {
                    let progress = JSON.parse(localStorage.getItem('heroesProgress') || '{}');
                    progress.elin = true;
                    localStorage.setItem('heroesProgress', JSON.stringify(progress));
                } catch(e) {}

                resultDiv.innerHTML = `
                    <div class="big">🎉</div>
                    <div class="title win">ПОБЕДА!</div>
                    <div class="desc">Вы собрали ${collected} ⭐ за 3 минуты!</div>
                    <div class="reward">🎁 Награда: +50 звёзд на аккаунт!</div>
                    <button class="btn-result win" onclick="closeGame(true)">✅ Отлично!</button>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="big">😢</div>
                    <div class="title lose">ВРЕМЯ ВЫШЛО!</div>
                    <div class="desc">Вы собрали ${collected} ⭐ из 150</div>
                    <div class="reward">Попробуйте ещё раз!</div>
                    <button class="btn-result retry" onclick="retryGame()" style="margin-right:10px;">🔄 Попробовать снова</button>
                    <button class="btn-result exit" onclick="closeGame(false)">🏠 Выйти</button>
                `;
            }

            container.appendChild(resultDiv);
        }

        // ============================================================
        //  ЗАКРЫТИЕ ИГРЫ
        // ============================================================
        function closeGame(won) {
            // Если победил, отправляем данные в главную игру
            if (won) {
                try {
                    // Пытаемся найти функцию из game.js
                    if (window.parent && window.parent.getCurrentUser) {
                        const user = window.parent.getCurrentUser();
                        if (user) {
                            user.stars = (user.stars || 0) + 50;
                            if (window.parent.saveAllData) window.parent.saveAllData();
                            if (window.parent.saveToServer) window.parent.saveToServer();
                        }
                    }
                } catch(e) {}
            }
            window.close();
        }

        function retryGame() {
            const result = container.querySelector('.result-overlay');
            if (result) result.remove();
            // Возвращаем кнопку "Начать"
            const newStartBtn = document.createElement('button');
            newStartBtn.id = 'startBtn';
            newStartBtn.textContent = '🌟 НАЧАТЬ';
            newStartBtn.style.cssText = `
                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                padding: 20px 50px; border: none; border-radius: 30px;
                background: linear-gradient(135deg, #ff6b9d, #ff2e63); color: #ffffff;
                font-size: 24px; font-weight: 700; cursor: pointer; z-index: 10;
                box-shadow: 0 0 60px rgba(255,105,180,0.3); animation: pulseBtn 2s ease-in-out infinite;
                transition: transform 0.3s;
            `;
            newStartBtn.onmouseover = () => { newStartBtn.style.transform = 'translate(-50%, -50%) scale(1.05)'; };
            newStartBtn.onmouseout = () => { newStartBtn.style.transform = 'translate(-50%, -50%) scale(1)'; };
            newStartBtn.onclick = startGame;
            container.appendChild(newStartBtn);
        }

        // ============================================================
        //  КНОПКА НАЗАД
        // ============================================================
        backBtn.onclick = function() {
            if (gameActive) {
                if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян!')) {
                    gameActive = false;
                    gameOver = true;
                    if (gameInterval) { clearInterval(gameInterval); gameInterval = null; }
                    if (starCreationInterval) { clearInterval(starCreationInterval); starCreationInterval = null; }
                    window.close();
                }
            } else {
                window.close();
            }
        };

        // ============================================================
        //  КНОПКА "НАЧАТЬ"
        // ============================================================
        startBtn.onclick = startGame;

        console.log('🌟 Игра Элин загружена!');
    </script>
</body>
</html>
